; SaboteurFix - in-memory fixes for The Saboteur. Put dinput8.dll + this file next to Saboteur.exe.
; Every option can be turned off. Log: SaboteurFix.log

[Main]
UnlockFPS=1                  ; remove the engine's 60 FPS limiter
FPSLimit=0                   ; 0 = no engine cap (cap with DXVK dxvk.conf / GPU driver). N = engine caps at N FPS
BorderlessFullscreen=1       ; with "Windowed 1" in config.ini: borderless window covering the whole monitor
HighResTimer=1               ; timeBeginPeriod(1): Sleep(1) in loading loops sleeps 1 ms instead of ~15.6 ms

[Graphics]
DistantHalos=0               ; EXPERIMENTAL: keep tiny/far light halos visible (may flash briefly)
MinRenderSlices=4            ; small props draw distance: every model drawn in at least N depth slices (4 = ~100 m, 5 = to the horizon, costly). 0 = vanilla

[Shadows]
ShadowMapSize=2048           ; vanilla 1024 (all 5 shadow cascades, max 8192). 4096 ~ 330 MB VRAM, 8192 ~ 1.3 GB VRAM (sharpest far shadows)
RebalanceCascades=1          ; push the hard shadow-detail switches farther away
Cascade0Far=4                ; vanilla 1.5 m
Cascade1Far=15               ; vanilla 5 m
Cascade2Far=40               ; vanilla 20 m
Cascade3Far=150              ; vanilla 100 m (the blocky far cascade starts after this)
SmallPropShadowCascades=4    ; small props without ModelInfo entry cast shadows in cascades 0..N-1 (vanilla 2-3; 5 = all, costly)

[World]
LODDistance=400              ; mesh LOD1 switch, vanilla 150 m
FoliageLODDistance=80        ; vanilla 50 m
PerModelLODScale=3.0         ; trees/bushes and models with their own LOD distance keep full detail N times farther (foliage 80 -> 240 m). 1 = vanilla
HumanLOD1Distance=30         ; vanilla 14 m
HumanLOD1DistanceImportant=60   ; vanilla 30 m
HumanLOD2Distance=60         ; vanilla 30 m
HumanLOD2DistanceImportant=120  ; vanilla 60 m
HumanDrawDistance=200        ; vanilla 105 m
HumanShadowDistance=50       ; vanilla 25 m
DrawDistance=2500            ; far plane with ClipRange 3, vanilla 1000 m
WaterReflectionScale=2       ; water reflection render target 512x128 * N (vanilla 1)
TrafficDensity=1.5           ; cars per metre of road x N (engine hard cap 64 cars)
GrassDistance=120           ; grass draw distance, vanilla 50 m
DetailObjectDistanceScale=2.0 ; placed grass/detail objects fade N times farther (1 = vanilla)
PedestrianRadius=115        ; pedestrians exist up to N m (vanilla 115). Bigger = people far away, but the same crowd is spread thinner
PedestrianSpawnRadius=80    ; nobody spawns in view closer than N m (vanilla 80, keep < PedestrianRadius)
TrafficRadius=300           ; roads spawn traffic within N m (vanilla 300, max 500; hard cap 64 cars)
StreamingDistance=120       ; EXPERIMENTAL world block keep distance, vanilla 120 m (max 240, more RAM)
StreamingDetailDistance=25  ; EXPERIMENTAL small world blocks keep distance, vanilla 25 m (max 100)

[FOV]
HorPlus=1                    ; keep the vertical FOV of the reference aspect, widen on wider screens (ultrawide fix)
ReferenceAspectWidth=16
ReferenceAspectHeight=9      ; 4 / 3 = much wider view on 16:9
FOVMultiplier=1.1            ; 1.0 = vanilla
VehicleSpeedFOVRampUp=0.25   ; speed-based car FOV blends in this fast (vanilla 0.08/s, very slow)
VehicleSpeedFOVRampDown=0.3  ; vanilla 0.1/s

[Input]
FrameIndependentMouse=1      ; vanilla mouse got 4x slower at 240 FPS (turn = per-frame delta * dt). 1 = same feel at any FPS
MouseSensitivityMultiplier=1.0
MouseVerticalMultiplier=1.0  ; on foot the game turns vertically at half the horizontal speed (PitchSpeed 2 vs RotSpeed 4); 2.0 = equal

[Movement]
AccelerationMultiplier=4.0   ; on-foot accel/decel (1.0 = vanilla floaty, 4.0 = snappy)
TurnFollow=1                 ; body turns to face the run direction at the same speed at any FPS (0 = vanilla per-frame)
SteeringSpeed=3.0            ; how fast the run direction swings on W->A etc. (1.0 = vanilla)
PivotTurnAngle=180           ; vanilla 90: turning more than this stops the player for a turn animation; 180 = never stop, steer while running

[Fixes]
PushPhysicsFix=1             ; NPC pushing behaves like at 60 FPS at any frame rate
CameraShakeFPSFix=1          ; camera shake spring + kicks time-based (vanilla stepped 0.05 s per frame)
SkidMarkFPSFix=1             ; skid marks fade/age in real time (vanilla per frame)
HavokPushFix=1               ; Havok character proxy pushed loose bodies/ragdolls 4x harder at 240 FPS
FrameTimers60Hz=1            ; 60 Hz virtual frame counter for frame-count timers
GroundSnapFPSFix=1           ; stairs/slope ground snap per frame -> time-based
MaxFrameTime=0.2             ; dt cap used ONLY in cutscenes/movies (gameplay is already capped at 0.05 s). 0.2 = vanilla, keeps cutscene audio sync
PerFrameDecayFix=1           ; trains, falling leaves, vehicle camera sway used per-frame decays (4x stronger at 240 FPS)
SpreadStreamingThreads=1     ; vanilla pins stream read/decompress + a job worker to the LAST logical CPU only

[UI]
SkipIntro=1                  ; skip the startup movie
KeepLegalScreen=0            ; 1 = keep the legal screen
LegalScreenSeconds=0         ; vanilla 4.5
AnimationSpeed=2.0           ; Scaleform UI / pause menu / fade speed (1 = vanilla)
KeepPauseMenuLoaded=1        ; ESC menu stays in memory (no re-streaming on every open)
KeepWorldMapLoaded=1         ; pause-menu map textures stay in memory (~9 MB; no spinner)

[Debug]
InputInjection=0            ; developer testing only: merge input from SaboteurFix_input.txt
PivotCounter=0               ; debug: count player stop-and-turn pivots (address in log)

