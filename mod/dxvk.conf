# The Saboteur - FPS Unlock: DXVK settings
# Change maxFrameRate to your monitor's refresh rate (120, 144, 165, 240...).

# Don't queue frames ahead -> much lower mouse/keyboard input lag
d3d9.maxFrameLatency = 1

# FPS cap (the exe patch removes the game's own 60 FPS limiter)
d3d9.maxFrameRate = 240

# Force VSync off
d3d9.presentInterval = 0
dxvk.tearFree = False

# DXVK low-latency frame pacing
dxvk.latencySleep = True
dxvk.latencyTolerance = 1000

# Texture quality: force 16x anisotropic filtering on all samplers
d3d9.samplerAnisotropy = 16

# Optional: sharper textures (may shimmer on foliage/fences). Uncomment to try.
# d3d9.samplerLodBias = -0.3


# AMD RDNA4 stability: DXVK 3.x descriptor-heap path can cause VK_ERROR_DEVICE_LOST (GPU hang)
dxvk.enableDescriptorHeap = False
